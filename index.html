<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impactfuel — Client Dashboard</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#000;
    --pink:#ff7bac;
    --pink-hover:#ff96be;
    --pink-tint:#fff0f6;
    --bg:#fff;
    --bg-alt:#f5f5f5;
    --muted:#86868b;
    --line:rgba(0,0,0,.10);
    --card:#fff;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
  }
  html[data-theme="dark"]{
    --ink:#f5f5f7;
    --bg:#0a0a0a;
    --bg-alt:#131313;
    --muted:#8e8e93;
    --line:rgba(255,255,255,.12);
    --card:#161616;
    --pink-tint:rgba(255,123,172,.12);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Poppins",system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    font-size:16px;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.mono-num{font-family:"Outfit",system-ui,sans-serif;letter-spacing:-.02em;}
  a{color:inherit;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px;}

  /* Header */
  header{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:10;}
  .header-inner{display:flex;align-items:center;justify-content:space-between;padding:20px 0;}
  .logo img{height:30px;display:block;}
  html[data-theme="dark"] .logo img{filter:invert(1) brightness(1.7);}
  .header-right{display:flex;align-items:center;gap:18px;}
  .internal-tag{
    font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    color:var(--pink);background:var(--pink-tint);padding:5px 10px;border-radius:100px;
  }
  .theme-toggle{
    background:none;border:1px solid var(--line);border-radius:100px;
    width:36px;height:36px;cursor:pointer;color:var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:15px;
    transition:border-color .2s, background .2s;
  }
  .theme-toggle:hover{border-color:var(--pink);background:var(--pink-tint);}

  /* Hero */
  .hero{padding:56px 0 34px;}
  .hero h1{font-size:2.6rem;font-weight:700;margin:0 0 10px;line-height:1.08;}
  .hero h1 .dot{color:var(--pink);}
  .hero p{color:var(--muted);margin:0;font-size:1rem;font-weight:300;max-width:52ch;}
  .stats{display:flex;gap:44px;margin-top:32px;}
  .stat-num{font-family:"Outfit";font-size:2rem;font-weight:700;line-height:1;}
  .stat-label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:7px;font-weight:500;}

  /* Search */
  .search-row{padding-bottom:26px;}
  #search{
    width:100%;max-width:380px;padding:12px 16px;
    border:1px solid var(--line);border-radius:12px;
    font-family:"Poppins",sans-serif;font-size:.94rem;
    background:var(--bg-alt);color:var(--ink);outline:none;
    transition:border-color .2s, background .2s;
  }
  #search:focus{border-color:var(--pink);background:var(--bg);}
  #search::placeholder{color:var(--muted);}

  /* Cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px;padding-bottom:60px;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:24px;box-shadow:var(--shadow);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(0,0,0,.05), 0 16px 40px rgba(0,0,0,.09);}
  .card-head{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
  .avatar{
    width:44px;height:44px;flex:0 0 44px;border-radius:12px;
    background:var(--ink);color:var(--bg);
    display:flex;align-items:center;justify-content:center;
    font-family:"Outfit";font-weight:700;font-size:.95rem;letter-spacing:-.01em;
  }
  html[data-theme="dark"] .avatar{background:var(--pink);color:#000;}
  .card-name{font-family:"Outfit";font-weight:700;font-size:1.15rem;line-height:1.2;}
  .card-meta{font-size:12px;color:var(--muted);margin-top:3px;}
  .badge{
    margin-left:auto;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:var(--pink);background:var(--pink-tint);padding:4px 9px;border-radius:100px;white-space:nowrap;
  }
  .group{margin-bottom:16px;}
  .group:last-child{margin-bottom:0;}
  .group-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;}
  .pills{display:flex;flex-wrap:wrap;gap:7px;}
  .pill{
    display:inline-block;padding:7px 13px;border-radius:100px;
    font-size:12.5px;font-weight:500;text-decoration:none;
    border:1px solid var(--line);color:var(--ink);
    transition:all .16s ease;
  }
  .pill:hover{border-color:var(--pink);color:var(--pink);background:var(--pink-tint);}
  .pill.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .pill.primary:hover{background:var(--pink);border-color:var(--pink);color:#000;}
  .empty{color:var(--muted);font-size:.92rem;padding:30px 0;font-weight:300;}

  /* Footer */
  footer{border-top:1px solid var(--line);padding:26px 0 40px;}
  .footer-inner{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;font-size:12.5px;color:var(--muted);}
  footer a{color:var(--pink);text-decoration:none;}
  footer a:hover{text-decoration:underline;}

  @media(max-width:600px){
    .hero h1{font-size:2rem;}
    .stats{gap:28px;}
    .wrap{padding:0 20px;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap header-inner">
    <a class="logo" href="/"><img src="/impactfuel-logo.png" alt="Impactfuel"></a>
    <div class="header-right">
      <span class="internal-tag">Internal</span>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">◐</button>
    </div>
  </div>
</header>

<section class="hero wrap">
  <h1>Client Dashboard<span class="dot">.</span></h1>
  <p>Every live client workspace and deliverable in one place. Links open the same pages your clients see.</p>
  <div class="stats">
    <div>
      <div class="stat-num" id="statClients">—</div>
      <div class="stat-label">Clients</div>
    </div>
    <div>
      <div class="stat-num" id="statPages">—</div>
      <div class="stat-label">Live pages</div>
    </div>
  </div>
</section>

<section class="wrap search-row">
  <input type="search" id="search" placeholder="Search clients…" autocomplete="off">
</section>

<main class="wrap">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">No clients match that search.</div>
</main>

<footer>
  <div class="wrap footer-inner">
    <span>&copy; <span id="year"></span> Impactfuel — internal use only</span>
    <span><a href="https://impactfuel.org">impactfuel.org</a></span>
  </div>
</footer>

<script>
  // Theme
  var root = document.documentElement;
  var saved = localStorage.getItem('if-theme');
  if (saved) root.setAttribute('data-theme', saved);
  document.getElementById('themeToggle').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('if-theme', next);
  });

  document.getElementById('year').textContent = new Date().getFullYear();

  var clients = [];

  function initials(name) {
    return name.trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase();
  }

  function cardHtml(c) {
    var groups = {};
    (c.deliverables || []).forEach(function (d) {
      var g = d.group || 'Pages';
      (groups[g] = groups[g] || []).push(d);
    });
    (c.reports || []).forEach(function (r) {
      (groups['Reports'] = groups['Reports'] || []).push({
        path: '/' + c.slug + '/reports/' + r.period,
        label: r.label
      });
    });

    var groupHtml = Object.keys(groups).map(function (g) {
      var pills = groups[g].map(function (d) {
        return '<a class="pill' + (d.primary ? ' primary' : '') + '" href="' + d.path + '">' + d.label + '</a>';
      }).join('');
      return '<div class="group"><div class="group-label">' + g + '</div><div class="pills">' + pills + '</div></div>';
    }).join('');

    var count = (c.deliverables || []).length + (c.reports || []).length;

    return '<article class="card" data-name="' + c.name.toLowerCase() + ' ' + c.slug + '">' +
      '<div class="card-head">' +
        '<div class="avatar">' + initials(c.name) + '</div>' +
        '<div><div class="card-name">' + c.name + '</div>' +
        '<div class="card-meta">' + count + ' live page' + (count === 1 ? '' : 's') + '</div></div>' +
        (c.status ? '<span class="badge">' + c.status + '</span>' : '') +
      '</div>' + groupHtml + '</article>';
  }

  function render(list) {
    document.getElementById('grid').innerHTML = list.map(cardHtml).join('');
    document.getElementById('empty').style.display = list.length ? 'none' : 'block';
  }

  fetch('/clients.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      clients = (data.clients || []).slice().sort(function (a, b) { return a.slug.localeCompare(b.slug); });
      var pages = clients.reduce(function (n, c) {
        return n + (c.deliverables || []).length + (c.reports || []).length;
      }, 0);
      document.getElementById('statClients').textContent = clients.length;
      document.getElementById('statPages').textContent = pages;
      render(clients);
    })
    .catch(function () {
      document.getElementById('grid').innerHTML =
        '<div class="empty">Could not load the client manifest (clients.json).</div>';
    });

  document.getElementById('search').addEventListener('input', function (e) {
    var q = e.target.value.trim().toLowerCase();
    render(!q ? clients : clients.filter(function (c) {
      return (c.name + ' ' + c.slug).toLowerCase().indexOf(q) !== -1;
    }));
  });
</script>
</body>
</html>
